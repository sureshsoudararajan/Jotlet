<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="noteGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffe066"/>
      <stop offset="100%" stop-color="#f5d328"/>
    </linearGradient>
    <linearGradient id="foldGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#e8c020"/>
      <stop offset="100%" stop-color="#d4a800"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#000" flood-opacity="0.2"/>
    </filter>
  </defs>
  <!-- Back note (offset) -->
  <rect x="24" y="14" width="88" height="96" rx="6" ry="6" fill="#a0d8a0" opacity="0.6" transform="rotate(6, 68, 62)"/>
  <!-- Middle note -->
  <rect x="20" y="18" width="88" height="96" rx="6" ry="6" fill="#99c1f1" opacity="0.7" transform="rotate(-3, 64, 66)"/>
  <!-- Front note (main) -->
  <g filter="url(#shadow)">
    <path d="M16,22 h80 a6,6 0 0 1 6,6 v68 l-22,22 H22 a6,6 0 0 1 -6,-6 V28 a6,6 0 0 1 6,-6 Z" fill="url(#noteGrad)"/>
    <!-- Folded corner -->
    <path d="M102,96 l-22,22 v-16 a6,6 0 0 1 6,-6 Z" fill="url(#foldGrad)"/>
  </g>
  <!-- Lines on front note -->
  <line x1="28" y1="42" x2="88" y2="42" stroke="#d4a800" stroke-width="1.2" stroke-linecap="round" opacity="0.4"/>
  <line x1="28" y1="54" x2="82" y2="54" stroke="#d4a800" stroke-width="1.2" stroke-linecap="round" opacity="0.4"/>
  <line x1="28" y1="66" x2="76" y2="66" stroke="#d4a800" stroke-width="1.2" stroke-linecap="round" opacity="0.4"/>
  <line x1="28" y1="78" x2="70" y2="78" stroke="#d4a800" stroke-width="1.2" stroke-linecap="round" opacity="0.4"/>
  <!-- Pin circle -->
  <circle cx="58" cy="16" r="8" fill="#e05050"/>
  <circle cx="58" cy="16" r="4" fill="#c03030"/>
  <circle cx="56" cy="14" r="1.5" fill="#f08080" opacity="0.8"/>
</svg>
