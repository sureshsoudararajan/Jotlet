[package]
name = "jotlet"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
description = "A lightweight, native GNOME Sticky Notes application"
repository = "https://github.com/example/jotlet"
readme = "README.md"

[dependencies]
gtk = { version = "0.11", package = "gtk4", features = ["v4_16"] }
adw = { version = "0.9", package = "libadwaita", features = ["v1_6"] }
glib = "0.22"
gio = "0.22"
rusqlite = { version = "0.40", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4"] }
log = "0.4"
env_logger = "0.11"
once_cell = "1"
regex = "1"

[build-dependencies]
glib-build-tools = "0.22"

[profile.release]
opt-level = 3
lto = true
strip = true
